<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday Apply - My Information</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f3f6; margin: 0; padding: 24px; }
    .container { max-width: 760px; margin: 0 auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header { border-bottom: 2px solid #e1e4e8; padding-bottom: 16px; margin-bottom: 24px; }
    .step-title { font-size: 14px; text-transform: uppercase; color: #586069; letter-spacing: 0.5px; margin: 0 0 4px 0; }
    h1 { font-size: 24px; color: #1c2d42; margin: 0; }
    .section-title { font-size: 18px; color: #1c2d42; margin: 24px 0 12px 0; border-bottom: 1px solid #eaecef; padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full-width { grid-column: span 2; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #24292e; }
    input, select { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid #d1d5da; border-radius: 4px; font-size: 14px; }
    input:focus, select:focus { border-color: #0875e1; outline: none; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #e1e4e8; }
    .btn-next { padding: 12px 28px; background: #0875e1; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-next:hover { background: #005bb5; }
    .btn-back { padding: 12px 24px; background: #f6f8fa; color: #24292e; border: 1px solid #d1d5da; border-radius: 4px; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container" data-automation-id="applicationFlow">
    <div class="header">
      <div class="step-title" data-automation-id="stepIndicator">Step 1 of 5</div>
      <h1 data-automation-id="step-header">My Information</h1>
    </div>

    <form id="contactForm" action="step3_experience.html" method="GET">
      <div class="section-title">Legal Name</div>
      <div class="grid">
        <div class="form-group">
          <label for="firstName">Legal First Name <span style="color:red">*</span></label>
          <input type="text" id="firstName" name="legalNameSection_firstName" data-automation-id="legalNameSection_firstName" aria-required="true" required />
        </div>
        <div class="form-group">
          <label for="lastName">Legal Last Name <span style="color:red">*</span></label>
          <input type="text" id="lastName" name="legalNameSection_lastName" data-automation-id="legalNameSection_lastName" aria-required="true" required />
        </div>
      </div>

      <div class="section-title">Address</div>
      <div class="grid">
        <div class="form-group full-width">
          <label for="addressLine1">Address Line 1 <span style="color:red">*</span></label>
          <input type="text" id="addressLine1" name="addressSection_addressLine1" data-automation-id="addressSection_addressLine1" aria-required="true" required />
        </div>
        <div class="form-group">
          <label for="city">City <span style="color:red">*</span></label>
          <input type="text" id="city" name="addressSection_city" data-automation-id="addressSection_city" aria-required="true" required />
        </div>
        <div class="form-group">
          <label for="countryRegion">State / Region <span style="color:red">*</span></label>
          <select id="countryRegion" name="addressSection_countryRegion" data-automation-id="addressSection_countryRegion" aria-required="true" required>
            <option value="">Select a State</option>
            <option value="CA">California</option>
            <option value="WA">Washington</option>
            <option value="NY">New York</option>
            <option value="TX">Texas</option>
            <option value="IL">Illinois</option>
          </select>
        </div>
        <div class="form-group">
          <label for="postalCode">Postal Code <span style="color:red">*</span></label>
          <input type="text" id="postalCode" name="addressSection_postalCode" data-automation-id="addressSection_postalCode" aria-required="true" required />
        </div>
      </div>

      <div class="section-title">Contact Information</div>
      <div class="grid">
        <div class="form-group full-width">
          <label for="email">Email Address <span style="color:red">*</span></label>
          <input type="email" id="email" name="contactSection_email" data-automation-id="contactSection_email" aria-required="true" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number <span style="color:red">*</span></label>
          <input type="tel" id="phone" name="contactSection_phone" data-automation-id="contactSection_phone" aria-required="true" required />
        </div>
        <div class="form-group">
          <label for="deviceType">Phone Device Type</label>
          <select id="deviceType" name="contactSection_deviceType" data-automation-id="contactSection_deviceType">
            <option value="Mobile">Mobile</option>
            <option value="Landline">Landline</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <a href="step1_auth.html" class="btn-back" data-automation-id="bottom-navigation-back-button">Back</a>
        <button type="submit" class="btn-next" data-automation-id="bottom-navigation-next-button" id="nextButton">Save and Continue</button>
      </div>
    </form>
  </div>
</body>
</html>
