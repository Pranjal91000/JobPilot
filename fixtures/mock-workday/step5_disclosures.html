<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday Apply - Voluntary Disclosures</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f3f6; margin: 0; padding: 24px; }
    .container { max-width: 760px; margin: 0 auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header { border-bottom: 2px solid #e1e4e8; padding-bottom: 16px; margin-bottom: 24px; }
    .step-title { font-size: 14px; text-transform: uppercase; color: #586069; letter-spacing: 0.5px; margin: 0 0 4px 0; }
    h1 { font-size: 24px; color: #1c2d42; margin: 0; }
    .notice { background: #fff8e5; border-left: 4px solid #f9a825; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #7f5f00; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #24292e; }
    select { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid #d1d5da; border-radius: 4px; font-size: 14px; }
    select:focus { border-color: #0875e1; outline: none; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; }
    .checkbox-group input { margin-top: 3px; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #e1e4e8; }
    .btn-next { padding: 12px 28px; background: #0875e1; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-next:hover { background: #005bb5; }
    .btn-back { padding: 12px 24px; background: #f6f8fa; color: #24292e; border: 1px solid #d1d5da; border-radius: 4px; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container" data-automation-id="applicationFlow">
    <div class="header">
      <div class="step-title" data-automation-id="stepIndicator">Step 4 of 5</div>
      <h1 data-automation-id="step-header">Voluntary Disclosures</h1>
    </div>

    <div class="notice">
      <strong>Equal Employment Opportunity Disclosures</strong><br />
      These questions are voluntary and classified as sensitive. Automated agents must not auto-fill these fields.
    </div>

    <form id="disclosuresForm" action="step6_review.html" method="GET">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" data-automation-id="gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Non-binary">Non-binary</option>
          <option value="Decline">I choose not to self-identify</option>
        </select>
      </div>

      <div class="form-group">
        <label for="raceEthnicity">Race / Ethnicity</label>
        <select id="raceEthnicity" name="raceEthnicity" data-automation-id="raceEthnicity">
          <option value="">Select Ethnicity</option>
          <option value="Hispanic/Latino">Hispanic or Latino</option>
          <option value="White">White (Not Hispanic or Latino)</option>
          <option value="Black">Black or African American</option>
          <option value="Asian">Asian</option>
          <option value="Decline">I choose not to self-identify</option>
        </select>
      </div>

      <div class="form-group">
        <label for="veteranStatus">Veteran Status</label>
        <select id="veteranStatus" name="veteranStatus" data-automation-id="veteranStatus">
          <option value="">Select Veteran Status</option>
          <option value="Not a veteran">I am not a protected veteran</option>
          <option value="Protected veteran">I identify as one or more classifications of protected veteran</option>
          <option value="Decline">I choose not to self-identify</option>
        </select>
      </div>

      <div class="form-group">
        <label for="disabilityStatus">Disability Status</label>
        <select id="disabilityStatus" name="disabilityStatus" data-automation-id="disabilityStatus">
          <option value="">Select Disability Status</option>
          <option value="No">No, I do not have a disability</option>
          <option value="Yes">Yes, I have a disability</option>
          <option value="Decline">I choose not to self-identify</option>
        </select>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="termsAgreement" name="termsAgreement" data-automation-id="termsAgreement" required />
          <label for="termsAgreement" style="font-weight: normal; font-size: 13px;">
            I certify that all statements made in this application are true and correct to the best of my knowledge. <span style="color:red">*</span>
          </label>
        </div>
      </div>

      <div class="actions">
        <a href="step4_questions.html" class="btn-back" data-automation-id="bottom-navigation-back-button">Back</a>
        <button type="submit" class="btn-next" data-automation-id="bottom-navigation-next-button" id="nextButton">Review Application</button>
      </div>
    </form>
  </div>
</body>
</html>
